name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            cross_deps: gcc-aarch64-linux-gnu
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            cc: cc
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            cc: cc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10"

      - name: Install cross-compiler
        if: matrix.cross_deps != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cross_deps }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
          CGO_CFLAGS: "-O2 -D__BLST_PORTABLE__"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -tags ledger \
            -ldflags "-s -w -X github.com/ava-labs/platform-cli/cmd.version=${VERSION}" \
            -o platform .

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="platform-cli_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -czf "${TARBALL}" platform
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-cli_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ env.TARBALL }}

  release:
    permissions:
      contents: write
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sha256sum platform-cli_*.tar.gz > "platform-cli_${VERSION}_checksums.txt"
          cat "platform-cli_${VERSION}_checksums.txt"

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$GITHUB_REF_NAME" ]; then
            echo "body=Initial release" >> "$GITHUB_OUTPUT"
          else
            CHANGES=$(git log --pretty=format:"- %s" "${PREV_TAG}..${GITHUB_REF_NAME}" | grep -v "^- Merge")
            # Use heredoc for multiline output
            {
              echo "body<<CHANGELOG_EOF"
              echo "$CHANGES"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_BODY: |
            ## Install

            ```sh
            curl -sSfL https://raw.githubusercontent.com/ava-labs/platform-cli/main/install.sh | sh
            ```

            Or download the binary for your platform below.

            ## Changelog

            ${{ steps.changelog.outputs.body }}
          RELEASE_FILES: dist/*
        run: |
          set -eo pipefail
          files=()
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            for f in $pattern; do
              [ -e "$f" ] || { echo "::error::No file matches ${pattern}"; exit 1; }
              files+=("$f")
            done
          done <<< "${RELEASE_FILES}"
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --notes "${RELEASE_BODY}"
            if [ ${#files[@]} -gt 0 ]; then
              gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
            fi
          else
            gh release create "${RELEASE_TAG}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --notes "${RELEASE_BODY}"
          fi
